name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-modules:
    name: Current-core workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out Adapter repository
        uses: actions/checkout@v7

      - name: Check out the pinned Weave core revision
        uses: actions/checkout@v7
        with:
          repository: imbrooklyn/weave
          ref: afbd6ad7c03266f52c52753cdb9ddbbb3ad7f6f8
          path: _ci/weave

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false

      - name: Create an isolated dependency workspace
        shell: bash
        run: |
          workspace_directory="$RUNNER_TEMP/weave-adapters-workspace"
          mkdir -p "$workspace_directory"
          cd "$workspace_directory"
          go work init "$GITHUB_WORKSPACE/elasticsearch" "$GITHUB_WORKSPACE/goqu" "$GITHUB_WORKSPACE/gorm" "$GITHUB_WORKSPACE/gormgen" "$GITHUB_WORKSPACE/ldap" "$GITHUB_WORKSPACE/memory" "$GITHUB_WORKSPACE/mongo"
          go work edit -replace github.com/imbrooklyn/weave="$GITHUB_WORKSPACE/_ci/weave"
          printf 'GOWORK=%s/go.work\n' "$workspace_directory" >> "$GITHUB_ENV"

      - name: Show Go version
        run: go version

      - name: Check repository metadata and modules
        run: ./scripts/check-repository.sh

      - name: Check formatting, tests, and vet
        run: ./scripts/verify.sh

      - name: Regenerate and verify the GORM Gen fixture
        working-directory: gormgen
        run: |
          go generate ./...
          git diff --exit-code -- internal/fixture/query
          go test ./internal/fixture/usage

  verify-independent-modules:
    name: GOWORK=off ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [memory, gormgen, gorm, goqu, mongo, ldap, elasticsearch]
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - name: Check out Adapter repository
        uses: actions/checkout@v7

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false

      - name: Show Go version
        run: go version

      - name: Verify the independent module boundary
        working-directory: ${{ matrix.module }}
        run: |
          go mod verify
          go mod tidy -diff
          go test -mod=readonly ./...
          go test -mod=readonly -race ./...
          go vet -mod=readonly ./...
          go test -mod=readonly -run '^$' -bench . -benchtime=1x

  fuzz-smoke:
    name: Fuzz ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: memory
            target: ^FuzzMemoryMatchesOracle$
          - module: gormgen
            target: ^FuzzGeneratedDAOBindsLiteralText$
          - module: gorm
            target: ^FuzzCompileLiteralText$
          - module: goqu
            target: ^FuzzCompilePreparedLiteralText$
          - module: mongo
            target: ^FuzzLiteralTextAlwaysStaysARegexString$
          - module: ldap
            target: ^FuzzParseFilterCanonicalization$
          - module: ldap
            target: ^FuzzCompileLiteralEscapingAndRedaction$
          - module: elasticsearch
            target: ^FuzzEscapeWildcardLiteral$
          - module: elasticsearch
            target: ^FuzzCompileLiteralAndRedaction$
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - name: Check out Adapter repository
        uses: actions/checkout@v7

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false

      - name: Run fuzz smoke test
        working-directory: ${{ matrix.module }}
        run: go test -mod=readonly -run '^$' -fuzz '${{ matrix.target }}' -fuzztime=2s -parallel=2

  verify-gormgen-integration:
    name: GORM Gen real backend semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    services:
      mysql:
        image: mysql@sha256:d58ac93387f644e4e040c636b8f50494e78e5afc27ca0a87348b2f577da2b7ff
        env:
          MYSQL_ROOT_PASSWORD: weave-gormgen-ci
          MYSQL_DATABASE: weave_gormgen
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=weave-gormgen-ci --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgresql:
        image: postgres@sha256:ef9d1517df69c4d27dbb9ddcec14f431a2442628603f4e9daa429b92ae6c3cd1
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave-gormgen-ci
          POSTGRES_DB: weave_gormgen
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=weave --dbname=weave_gormgen"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out Adapter repository
        uses: actions/checkout@v7

      - name: Check out the pinned Weave core revision
        uses: actions/checkout@v7
        with:
          repository: imbrooklyn/weave
          ref: afbd6ad7c03266f52c52753cdb9ddbbb3ad7f6f8
          path: _ci/weave

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: false

      - name: Create an isolated dependency workspace
        shell: bash
        run: |
          workspace_directory="$RUNNER_TEMP/weave-adapters-workspace"
          mkdir -p "$workspace_directory"
          cd "$workspace_directory"
          go work init "$GITHUB_WORKSPACE/gormgen"
          go work edit -replace github.com/imbrooklyn/weave="$GITHUB_WORKSPACE/_ci/weave"
          printf 'GOWORK=%s/go.work\n' "$workspace_directory" >> "$GITHUB_ENV"

      - name: Run generated-DAO semantics on real MySQL and PostgreSQL
        working-directory: gormgen
        env:
          WEAVE_GORMGEN_MYSQL_DSN: root:weave-gormgen-ci@tcp(127.0.0.1:3306)/weave_gormgen?charset=utf8mb4&parseTime=true&loc=UTC
          WEAVE_GORMGEN_POSTGRES_DSN: host=127.0.0.1 port=5432 user=weave password=weave-gormgen-ci dbname=weave_gormgen sslmode=disable
        run: go test -race -tags=integration -count=1 -run '^TestIntegrationProfiles$' -v .
